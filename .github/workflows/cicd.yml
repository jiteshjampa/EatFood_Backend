name: Deploy Node Application
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: log in to docker hub

        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
      - name: Build Docker Image
        run: docker build -t jiteshjampa26/nodejs-app .
      - name: Publish image to docker hub
        run: docker push jiteshjampa26/nodejs-app:latest
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: pull image from dockerhub
        run: docker pull jiteshjampa26/nodejs-app:latest
      - name: Run Docker Container
        run: docker run -d -p 5000:5000 --name nodejs-app-container -e MONGO_PASSWORD='${{secrets.MONGO_PASSWORD}}' jiteshjampa26/nodejs-app:latest
